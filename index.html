<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>메모장</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 20px auto; padding: 10px; }
  .auth-bar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-bottom: 12px; min-height: 36px; }
  .auth-bar img { width: 28px; height: 28px; border-radius: 50%; }
  .auth-bar .name { font-size: 14px; }
  .auth-bar button { padding: 6px 12px; cursor: pointer; }
  .auth-bar .link-btn { background: none; border: none; color: #4a90e2; text-decoration: underline; font-size: 12px; padding: 4px; cursor: pointer; }
  .notice { background: #fff8e1; border: 1px solid #ffe082; color: #6d4c00; padding: 8px 10px; border-radius: 4px; font-size: 13px; margin-bottom: 10px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .header button { font-size: 16px; padding: 4px 10px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; }
  th, td { width: 14.28%; text-align: center; padding: 10px 0; border: 1px solid #eee; }
  th { background: #f5f5f5; }
  td.day { cursor: pointer; }
  td.day:hover { background: #eef; }
  td.selected { background: #4a90e2; color: #fff; }
  td.has-memo { font-weight: bold; color: #d9534f; }
  td.empty { background: #fafafa; cursor: default; }
  td.disabled { cursor: not-allowed; color: #bbb; }
  .sun { color: #d9534f; }
  .sat { color: #4a90e2; }
  .memo-area { margin-top: 16px; }
  .memo-area h3 { margin: 0 0 6px; font-size: 15px; }
  textarea { width: 100%; height: 160px; padding: 8px; box-sizing: border-box; font-size: 14px; }
  .actions { margin-top: 8px; display: flex; gap: 8px; }
  .actions button { padding: 6px 14px; cursor: pointer; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="auth-bar">
    <button id="login-btn">Google로 로그인</button>
    <button id="login-other-btn" class="link-btn">다른 계정 사용</button>
    <img id="user-photo" class="hidden" alt="">
    <span id="user-name" class="name hidden"></span>
    <button id="logout-btn" class="hidden">로그아웃</button>
  </div>
  <div id="notice" class="notice">로그인하면 메모가 모든 기기에 동기화됩니다.</div>

  <div class="header">
    <button id="prev">‹</button>
    <h2 id="title"></h2>
    <button id="next">›</button>
  </div>
  <table>
    <thead>
      <tr><th class="sun">일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th class="sat">토</th></tr>
    </thead>
    <tbody id="cal"></tbody>
  </table>
  <div class="memo-area">
    <h3 id="memo-title">날짜를 선택하세요</h3>
    <textarea id="memo" placeholder="메모를 입력하세요..." disabled></textarea>
    <div class="actions">
      <button id="save" disabled>저장</button>
      <button id="delete" disabled>삭제</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAml552PB8Whc-rG4BIRP1NL6pMwElMS2c",
    authDomain: "memo-app-42672.firebaseapp.com",
    projectId: "memo-app-42672",
    storageBucket: "memo-app-42672.firebasestorage.app",
    messagingSenderId: "305811514979",
    appId: "1:305811514979:web:9790ec1e014d67f7bfba56"
  };

  const app = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  let current = new Date();
  current.setDate(1);
  let selectedKey = null;
  let memos = {};
  let currentUser = null;
  let unsubscribeMemos = null;

  const keyOf = (y, m, d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

  function render() {
    const y = current.getFullYear();
    const m = current.getMonth();
    document.getElementById('title').textContent = `${y}년 ${m+1}월`;

    const firstDay = new Date(y, m, 1).getDay();
    const lastDate = new Date(y, m+1, 0).getDate();

    const tbody = document.getElementById('cal');
    tbody.innerHTML = '';
    let row = document.createElement('tr');
    for (let i = 0; i < firstDay; i++) row.appendChild(td('', true));

    for (let d = 1; d <= lastDate; d++) {
      const key = keyOf(y, m, d);
      const cell = td(d, false);
      cell.classList.add('day');
      if (!currentUser) cell.classList.add('disabled');
      if (memos[key]) cell.classList.add('has-memo');
      if (key === selectedKey) cell.classList.add('selected');
      if (currentUser) cell.addEventListener('click', () => selectDate(key));
      row.appendChild(cell);
      if ((firstDay + d) % 7 === 0) { tbody.appendChild(row); row = document.createElement('tr'); }
    }
    if (row.children.length) {
      while (row.children.length < 7) row.appendChild(td('', true));
      tbody.appendChild(row);
    }
  }

  function td(text, empty) {
    const cell = document.createElement('td');
    cell.textContent = text;
    if (empty) cell.classList.add('empty');
    return cell;
  }

  function selectDate(key) {
    if (!currentUser) return;
    selectedKey = key;
    document.getElementById('memo-title').textContent = key + ' 메모';
    const ta = document.getElementById('memo');
    ta.value = memos[key] || '';
    ta.disabled = false;
    document.getElementById('save').disabled = false;
    document.getElementById('delete').disabled = false;
    render();
  }

  function clearMemoArea() {
    selectedKey = null;
    document.getElementById('memo-title').textContent = '날짜를 선택하세요';
    const ta = document.getElementById('memo');
    ta.value = '';
    ta.disabled = true;
    document.getElementById('save').disabled = true;
    document.getElementById('delete').disabled = true;
  }

  document.getElementById('prev').onclick = () => { current.setMonth(current.getMonth()-1); render(); };
  document.getElementById('next').onclick = () => { current.setMonth(current.getMonth()+1); render(); };

  document.getElementById('save').onclick = async () => {
    if (!selectedKey || !currentUser) return;
    const text = document.getElementById('memo').value.trim();
    const ref = doc(db, 'users', currentUser.uid, 'memos', selectedKey);
    try {
      if (text) {
        await setDoc(ref, { text, updatedAt: serverTimestamp() });
      } else {
        await deleteDoc(ref);
      }
      alert('저장되었습니다.');
    } catch (e) {
      alert('저장 실패: ' + e.message);
    }
  };

  document.getElementById('delete').onclick = async () => {
    if (!selectedKey || !currentUser) return;
    try {
      await deleteDoc(doc(db, 'users', currentUser.uid, 'memos', selectedKey));
      document.getElementById('memo').value = '';
    } catch (e) {
      alert('삭제 실패: ' + e.message);
    }
  };

  document.getElementById('login-btn').onclick = async () => {
    try {
      provider.setCustomParameters({});
      await signInWithPopup(auth, provider);
    } catch (e) {
      alert('로그인 실패: ' + e.message);
    }
  };

  document.getElementById('login-other-btn').onclick = async () => {
    try {
      provider.setCustomParameters({ prompt: 'select_account' });
      await signInWithPopup(auth, provider);
    } catch (e) {
      alert('로그인 실패: ' + e.message);
    }
  };

  document.getElementById('logout-btn').onclick = async () => {
    try {
      await signOut(auth);
    } catch (e) {
      alert('로그아웃 실패: ' + e.message);
    }
  };

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    const loginBtn = document.getElementById('login-btn');
    const loginOtherBtn = document.getElementById('login-other-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const photo = document.getElementById('user-photo');
    const name = document.getElementById('user-name');
    const notice = document.getElementById('notice');

    if (unsubscribeMemos) { unsubscribeMemos(); unsubscribeMemos = null; }
    memos = {};
    clearMemoArea();

    if (user) {
      loginBtn.classList.add('hidden');
      loginOtherBtn.classList.add('hidden');
      logoutBtn.classList.remove('hidden');
      photo.src = user.photoURL || '';
      photo.classList.toggle('hidden', !user.photoURL);
      name.textContent = user.displayName || user.email || '';
      name.classList.remove('hidden');
      notice.classList.add('hidden');

      unsubscribeMemos = onSnapshot(
        collection(db, 'users', user.uid, 'memos'),
        (snap) => {
          memos = {};
          snap.forEach((d) => { memos[d.id] = d.data().text || ''; });
          if (selectedKey) {
            document.getElementById('memo').value = memos[selectedKey] || '';
          }
          render();
        },
        (err) => { alert('데이터 로드 실패: ' + err.message); }
      );
    } else {
      loginBtn.classList.remove('hidden');
      loginOtherBtn.classList.remove('hidden');
      logoutBtn.classList.add('hidden');
      photo.classList.add('hidden');
      name.classList.add('hidden');
      notice.classList.remove('hidden');
    }
    render();
  });

  render();
</script>
</body>
</html>
